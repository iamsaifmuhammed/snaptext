[package]
name = "snaptext"
version = "1.1.1"
description = "Lightweight screenshot and OCR utility"
authors = ["SnapText contributors"]
edition = "2021"

[lib]
name = "snaptext_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.24.9", default-features = false, features = ["png", "jpeg"] }
screenshots = "0.8.10"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
  "Foundation",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
] }
